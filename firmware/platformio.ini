[platformio]
default_envs = esp32-c3-supermini
src_dir = src

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
monitor_speed = 115200
monitor_echo = yes
framework = espidf
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 2MB

; Etapa 3 — MODO SIMULACAO: carga e chute fisicos bloqueados no firmware.
; Compilar/gravar explicitamente com:  pio run -e esp32-c3-supermini-sim -t upload
[env:esp32-c3-supermini-sim]
extends = env:esp32-c3-supermini
build_flags = -DKICKER_SIMULACAO=1
